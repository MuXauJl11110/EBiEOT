defaults:
  - _self_
  - model: swiss_roll
  - samplers: swiss_roll
  - optimizer: adam
  - experiment: default
  - plan_sampler: ot

seed: 30
device: auto # Auto-discover accelerator e.g. cuda
double_precision: True
project: Light-GCOT
name: Swiss_Roll

hydra:
  # Logging configuration: https://hydra.cc/docs/tutorials/basic/running_your_app/logging/
  verbose: False
  # Logs to stdout and to a file.
  job_logging:
    handlers:
      console:
        class: logging.StreamHandler
        stream: ext://sys.stdout
      file:
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}_${oc.select:hydra.job.num, 0}.log
  # Set the output directory to /tmp to dump logs.
  run:
    dir: /tmp/hydra/logs/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: /tmp/hydra/logs/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
