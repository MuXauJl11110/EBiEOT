[project]
name = "light-gcot"
version = "0.0.0"
description = "Light-GCOT / GMMEOT experiments"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy>=2.1",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "POT>=0.9",
    "Pillow>=10",
    "tqdm>=4.66",
    "papermill>=2.6",
    "nflows>=0.14",
    "gensim>=4.3",
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
