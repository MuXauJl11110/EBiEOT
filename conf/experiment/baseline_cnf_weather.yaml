# @package _global_
defaults:
  - /baseline/train@train: cnf
  - /baseline/model@model: cnf
  - /dataset: weather/baseline
  - _self_

method: cnf
task_name: train_baseline

model:
  features: ${dataset.y_dim}
  context_features: ${dataset.x_dim}
  hidden_features: [128]
  hidden_context_features: 512
  num_layers: 5
  num_blocks_per_layer: 4
  use_volume_preserving: false

train:
  steps_to: 10000
  batch_size: 128
