# @package _global_
defaults:
  - /train: neural
  - /dataset: colored_mnist/images
  - /ebieot/model/neural@ebieot.model: default
  - /ebieot/costs/cnn@ebieot.cost: vanilla
  - /ebieot/potentials/cnn@ebieot.potential: vanilla
  - _self_

method: neural

train:
  name: Neural_CNN_Vanilla_Colored_MNIST
  paired_batch_size: 64
  unpaired_batch_size: 64
  steps_to: 500
  log_every: 50
  plot_every: 250
  optimizer:
    paired:
      lr: 3.0e-5
    unpaired:
      lr: 3.0e-5

ebieot:
  model:
    num_iterations: 100
    epsilon: 0.01
    projection:
      min: -1.0
      max: 1.0
      is_projected: true
    buffer:
      noise_std: 0.1
      max_samples: 10000
