# @package _global_
defaults:
  - /train: neural
  - /dataset: colored_mnist/default
  - /ebieot/model/neural@ebieot.model: default
  - /ebieot/costs/nn@ebieot.cost: mlp
  - /ebieot/potentials@ebieot.potential: default
  - _self_

method: neural

train:
  name: Neural-Based_Colored_MNIST
  paired_batch_size: 128
  unpaired_batch_size: 128
  steps_to: 5000
  log_every: 50
  plot_every: 250
  optimizer:
    paired:
      lr: 1.0e-5
    unpaired:
      lr: 3.0e-5

ebieot:
  cost:
    x_dim: ${dataset.x_dim}
    y_dim: ${dataset.y_dim}
    hidden_layers: [1024, 512]
  potential:
    input_dim: ${dataset.y_dim}
    hidden_layers: [1024, 512]
  model:
    num_iterations: 500
    projection:
      min: -1.0
      max: 1.0
      is_projected: true
    buffer:
      noise_std: 0.1
      max_samples: 10000
