# @package _global_
# Legacy EgEOT_swiss_roll_128 preset: 128 paired, 3k steps, 1024 batches.
defaults:
  - /train: neural
  - /dataset: synthetic/swiss_roll
  - /ebieot/model/neural@ebieot.model: default
  - /ebieot/costs/nn@ebieot.cost: mlp
  - /ebieot/potentials@ebieot.potential: default
  - _self_

method: neural

dataset:
  P_XY_paired: 128
  Q_X_unpaired: 1024
  R_Y_unpaired: 1024

ebieot:
  cost:
    hidden_layers: [128, 128]
  potential:
    hidden_layers: [256, 256, 256]

train:
  optimizer:
    paired:
      lr: 3.0e-4
    unpaired:
      lr: 2.0e-4
  paired_batch_size: 1024
  unpaired_batch_size: 1024
  steps_to: 3000
