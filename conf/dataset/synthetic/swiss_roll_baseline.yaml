# Swiss-roll dataset defaults for inverse-OT baselines (same fields as swiss_roll + paired_cache).
x_dim: 2
y_dim: 2
P_XY_paired: 1024
Q_X_unpaired: 1024
R_Y_unpaired: 1024

minibatch:
  method: sinkhorn
  reg: 0.05
  reg_m: 1.0
  cost_function: rotation-v2
  normalize_cost: false

paired_cache:
  enabled: false
  dir: ${paths.output_dir}/paired_tensors
  file_postfix: ${dataset.minibatch.cost_function}_${dataset.P_XY_paired}
