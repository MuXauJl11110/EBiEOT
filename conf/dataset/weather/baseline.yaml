# Weather dataset defaults for inverse-OT baselines.
x_dim: 188
y_dim: 94
P_XY_paired: 90
Q_X_unpaired: 500
R_Y_unpaired: 500
batch_size: 128

minibatch:
  method: sinkhorn
  reg: 0.05
  reg_m: 1.0
  cost_function: rotation-v2
  normalize_cost: false

paired_cache:
  enabled: false
  dir: ${paths.output_dir}/paired_tensors
  file_postfix: ${dataset.minibatch.cost_function}_${dataset.P_XY_paired}

# CGAN discriminator input dim for Y side (legacy notebook used 141).
discriminator_y_dim: 141
